<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawl Keeper menu</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; font-family: Roboto, system-ui, sans-serif; }
      #menu { display: flex; flex-direction: column; padding: 4px 0; }
      button {
        display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 16px;
        border: 0; background: transparent; color: var(--text, #fff); font: inherit; font-size: 14px;
        text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      button:hover:not(:disabled), button:focus-visible { background: var(--hover, rgba(255, 255, 255, 0.08)); outline: none; }
      button:disabled { opacity: 0.45; cursor: default; }
      button img { width: 18px; height: 18px; flex-shrink: 0; }
      .light img { filter: invert(1); }
    </style>
  </head>
  <body>
    <div id="menu" role="menu" aria-label="Crawl Keeper"></div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Crawl Keeper full mockup</title>
<style>
:root{--paper:#222639;--text:#fff;--text2:#bbb;--dis:#777;--primary:#bb99ff;--line:rgba(255,255,255,.08);--ember:#ff9a3c;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:#14161f;color:var(--text);font-family:Roboto,system-ui,sans-serif;padding:24px}
h1{font-size:16px;margin:0 0 4px}.lead{font-size:12.5px;color:var(--text2);margin:0 0 18px;max-width:1150px;line-height:1.5}
.wrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;color:var(--text2);width:380px;margin:0 2px 8px;min-height:50px;line-height:1.45}
.cap b{color:var(--text)}
.pn{background:var(--paper);border-radius:14px;width:380px;padding:12px 0 8px;font-size:13px;position:relative}
.h{display:flex;align-items:center;gap:8px;padding:0 12px 10px}.h b{font-size:16px}.h .rb{background:rgba(0,0,0,.25);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--text2)}.h .g{margin-left:auto;color:var(--text2)}
/* hero */
.hero{margin:0 12px;display:grid;grid-template-columns:76px 1fr 76px;gap:12px;align-items:center;background:linear-gradient(160deg,#2a2f47,#1b1f2e);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.hero.due{border-color:rgba(187,153,255,.7);box-shadow:0 0 0 3px rgba(187,153,255,.15)}
.dcol,.rollb{display:flex;flex-direction:column;align-items:center;gap:4px;align-self:start}.dcol small{font-size:10.5px;color:var(--text2);text-align:center}.dbx{width:76px;height:76px;display:grid;place-items:center}.dial{position:relative;width:76px;height:76px}.dial .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.dial .c b{font-size:21px;display:block;line-height:1}.dial .c small{font-size:9.5px;color:var(--text2);letter-spacing:.07em}
.dd{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 9px;border-radius:8px;background:rgba(0,0,0,.25)}
.meta{font-size:11.5px;color:var(--text2);margin:5px 0 7px}
.meta .omen{color:#ffd166}
.torch{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 6px;font-size:12px;font-weight:500;background:rgba(255,160,60,.12);color:#ffb15c}
.torch.out{background:rgba(0,0,0,.35);color:#9a9a9a}

.die6{width:56px;height:56px;border-radius:12px;background:#f4f1ea;position:relative;box-shadow:0 4px 0 #b9b2a3,0 8px 16px rgba(0,0,0,.4)}
.die6.enc{background:var(--red);box-shadow:0 4px 0 #a33c3c,0 8px 16px rgba(0,0,0,.4)}
.die6.due{outline:3px solid rgba(187,153,255,.55);outline-offset:3px}
.die6 i{position:absolute;width:10px;height:10px;border-radius:50%;background:#1b1b1b}.die6.enc i{background:#fff}
.die6 .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px;color:#1b1b1b}
.die6 .tag{position:absolute;right:-6px;top:-6px;background:#2b3046;color:var(--text2);font-size:9.5px;border-radius:6px;padding:1px 4px;border:1px solid var(--line)}
.rollb small{font-size:10.5px;color:var(--text2);text-align:center;line-height:1.2}.rollb small.enc{color:#ff8a8a;font-weight:700}
.rollb u{font-size:10.5px;color:var(--text2)}
/* combat banner replaces hero */
.cbt{margin:0 12px;display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);font-size:12.5px;color:#ffb3b3}
.cbt b{color:#fff}
/* toolbar */
.tb{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:2px}.seg span{padding:4px 13px;border-radius:999px;font-size:12.5px;font-weight:500}.seg .a{background:var(--primary);color:#000}.seg .a.red{background:var(--red);color:#000}
.sort{color:var(--text2);font-size:12px;margin-left:2px}
.nv{margin-left:auto;display:flex;gap:6px}.nv span{width:38px;height:28px;border-radius:999px;display:grid;place-items:center;background:rgba(0,0,0,.25)}.nv .a{background:var(--primary);color:#000}
/* table */
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.1em;color:var(--dis);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;height:38px}
td.cb{width:30px;padding-left:12px}
.box{width:14px;height:14px;border:1.5px solid #5d6178;border-radius:3px;display:block}
.box.x{background:var(--primary);border-color:var(--primary);position:relative}
.box.x::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
td.av{width:30px}td.av i{display:block;width:26px;height:26px;border-radius:50%;position:relative}
td.av i .dot{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;background:#f5c542;border:2px solid var(--paper)}
td.nm{line-height:1.2}td.nm b{font-weight:600;font-size:13.5px}td.nm small{display:block;color:var(--text2);font-size:11.5px}
td.nm small.eq{font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
td.in{text-align:right;width:70px;padding-right:12px;font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:nowrap}
td.in .d{color:var(--primary);vertical-align:middle;margin-right:6px;display:inline-block;border-radius:6px;padding:2px}
td.in .d.open{background:rgba(187,153,255,.22)}
tr.cur td{background:rgba(187,153,255,.16)}tr.cur td.cb{box-shadow:inset 3px 0 0 var(--primary)}
tr.picked td{background:rgba(187,153,255,.06)}
tr.dead td{opacity:.4}tr.dead td.nm b{text-decoration:line-through}
tr.mon td{height:30px;font-size:12.5px}tr.mon td.nm{padding-left:16px}tr.mon td.nm b{font-weight:500}
tr.mon td.nm::before{content:"└ ";color:#555}
tr.mon td.av i{width:20px;height:20px;margin-left:3px}
tr.mhd td{height:24px;font-size:11px;color:var(--text2);padding-left:44px;letter-spacing:.04em}
tr.mhd .stk{display:inline-flex;margin-left:6px;vertical-align:middle}tr.mhd .stk i{width:13px;height:13px;border-radius:50%;border:2px solid var(--paper);margin-left:-4px;display:block}
tr.exp td{background:rgba(0,0,0,.22);height:auto;padding:8px 12px}
.ex{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.ex .st{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px}.ex .st span{padding:2px 8px}.ex .st b{padding:2px 6px;color:var(--text)}
.ex .go{margin-left:auto;background:var(--primary);color:#000;border-radius:6px;padding:4px 10px;font-weight:600}
.ex .via{font-size:10.5px;color:var(--dis)}
.ft{display:flex;justify-content:space-between;color:var(--text2);font-size:11px;padding:8px 12px 0}
.notes{margin-top:30px;max-width:1150px;font-size:12.5px;color:var(--text2);line-height:1.6}
.notes b{color:var(--text)}
</style><style>
.pop2{background:var(--paper);border-radius:14px;width:380px;height:680px;display:flex;flex-direction:column;overflow:hidden;font-size:13px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.top{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.top b{font-size:17px;font-weight:500}.top .gear{margin-left:auto;color:var(--text2);width:32px;height:32px;display:grid;place-items:center;border-radius:999px}
.rp{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:500;background:rgba(187,153,255,.14);color:#d9c8ff}
.rp i{width:6px;height:6px;border-radius:50%;background:var(--primary);display:block}
.rp.cbt2{background:rgba(255,107,107,.14);color:#ffc2c2}.rp.cbt2 i{background:var(--red)}
.rp .n{font-weight:700;color:#fff}
.body{flex:1;overflow:auto;padding-top:10px}
.foot2{padding:6px 12px 8px;font-size:11px;color:var(--dis);display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.grip{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 6px}
/* player */
.ph{margin:0 12px;display:flex;align-items:center;gap:12px;border-radius:14px;padding:8px 12px;background:linear-gradient(160deg,#2a2f47,#1b1f2e);border:1px solid var(--line)}
.ph .tx{font-size:12px;color:var(--text2);line-height:1.5}.ph .tx b{color:var(--text);font-size:13px}
.yt{margin:8px 12px 0;border-radius:10px;padding:7px 12px;background:rgba(187,153,255,.16);color:#e6dcff;font-size:12.5px;display:flex;gap:8px;align-items:center}
.yt b{color:#fff}
/* settings */
.sg{padding:0 12px 12px}
.sg h3{font-size:11px;letter-spacing:.06em;color:var(--text2);font-weight:500;text-transform:uppercase;margin:14px 4px 6px}
.card{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.it .l{flex:1}.it .l b{font-weight:500;display:block;font-size:13px}.it .l small{color:var(--text2);font-size:11.5px;line-height:1.4;display:block;margin-top:2px}
.sw{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#ddd}
.sw.on{background:var(--primary)}.sw.on::after{left:16px;background:#fff}
.seg2{display:flex;background:var(--paper);border-radius:999px;padding:3px;margin:2px 0 6px}.seg2 span{flex:1;text-align:center;padding:5px 0;border-radius:999px;font-weight:500;font-size:12.5px}.seg2 .a{background:var(--primary);color:#000}
.howto{display:flex;align-items:center;gap:12px;padding:12px 14px}
.howto .ic{width:30px;height:30px;border-radius:8px;background:rgba(187,153,255,.16);color:var(--primary);display:grid;place-items:center;font-weight:700}
.dt{font-size:12px;color:var(--primary);margin-top:2px}
.inst{display:flex;gap:6px;margin-top:6px}.inst code{flex:1;background:rgba(0,0,0,.3);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inst span{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px}
.back{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--text2)}
</style>
</head><body>
<h1>Crawl Keeper v0.1.1: full extension mockup</h1>
<p class="lead">The whole popover as Owlbear shows it (380 × 680, dark theme): the GM crawling, the GM in combat, a player’s read-only view, and Settings. The round count moves into a pill beside the title that also says the phase.</p>
<div class="wrap" id="out"></div>
<script>
const d20=(s=15)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l9 5v10l-9 5-9-5V7z M12 2l-5 9h10z M7 11l-4 6M17 11l4 6M7 11l5 11 5-11"/></svg>`;
const chev=o=>`<svg width="10" height="10" viewBox="0 0 10 10"><path d="${o?'M1 3l4 4 4-4':'M3 1l4 4-4 4'}" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>`;
const torch=lit=>`<svg width="13" height="18" viewBox="0 0 14 20">${lit?'<path d="M7 1c2 3 4 4 4 7a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-2-1-4 0-6z" fill="#ff9a3c"/><path d="M7 5c1 2 2 2.5 2 4a2 2 0 0 1-4 0c0-1 1-2 2-4z" fill="#ffe08a"/>':'<path d="M6 2c-1 1 1 2 0 3M8 1c-1 1 1 2 0 3" stroke="#777" fill="none"/>'}<rect x="5" y="10" width="4" height="9" rx="1" fill="#8a6a45"/><rect x="4" y="9" width="6" height="2" rx="1" fill="${lit?'#5a3d22':'#444'}"/></svg>`;
const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[25,25],[50,50],[75,75]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[25,25],[75,25],[50,50],[25,75],[75,75]],6:[[28,22],[72,22],[28,50],[72,50],[28,78],[72,78]]};
const pips=n=>P[n].map(([x,y])=>`<i style="left:calc(${x}% - 5px);top:calc(${y}% - 5px)"></i>`).join('');
const C0=38,at=(d,r)=>[C0+r*Math.cos(d*Math.PI/180),C0+r*Math.sin(d*Math.PI/180)];
const pth=p=>'M'+p.map(([x,y])=>x.toFixed(1)+' '+y.toFixed(1)).join(' L')+'Z';
const RR=26,KK=0.86,HEX=[-90,-30,30,90,150,210].map(d=>at(d,RR)),FACE=[[C0,C0-KK*RR],[C0+0.84*KK*RR,C0+0.62*KK*RR],[C0-0.84*KK*RR,C0+0.62*KK*RR]];
const FCY=(FACE[0][1]+FACE[1][1]+FACE[2][1])/3;
const FAC=[[FACE[0],HEX[0],HEX[1]],[FACE[0],HEX[1],FACE[1]],[FACE[1],HEX[1],HEX[2]],[FACE[1],HEX[2],HEX[3]],[FACE[1],HEX[3],FACE[2]],[FACE[2],HEX[3],HEX[4]],[FACE[2],HEX[4],HEX[5]],[FACE[2],HEX[5],FACE[0]],[FACE[0],HEX[5],HEX[0]]];
let gid=0;
const d20face=(txt)=>{const id=gid++,fs=String(txt).length>1?15:18,tone=[.28,.14,.06,0,0,.04,.1,.2,.34];
 return `<defs><linearGradient id="b${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc4ff"/><stop offset="1" stop-color="#1d3f8f"/></linearGradient><linearGradient id="f${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f97ff"/><stop offset="1" stop-color="#2c5bd0"/></linearGradient></defs>
 <path d="${pth(HEX)}" fill="url(#b${id})" stroke="#0c1d4a" stroke-linejoin="round"/>${FAC.map((f,i)=>`<path d="${pth(f)}" fill="rgba(255,255,255,${tone[i]})" stroke="#0c1d4a" stroke-opacity=".55" stroke-width=".8" stroke-linejoin="round"/>`).join('')}
 <path d="${pth(FACE)}" fill="url(#f${id})" stroke="#0c1d4a" stroke-opacity=".6" stroke-width=".8" stroke-linejoin="round"/>
 <text x="38" y="${FCY+fs*.36+.8}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="rgba(5,15,60,.6)">${txt}</text><text x="38" y="${FCY+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${txt}</text>`;};
function segDial(left,of,dark){const R=32,C=2*Math.PI*R,g=6,seg=C/of-g;let o='';for(let i=0;i<of;i++){const f=i<of-left;o+=`<circle cx="38" cy="38" r="${R}" fill="none" stroke="${f?(dark?'#ff9a3c':'#bb99ff'):'rgba(255,255,255,.12)'}" stroke-width="7" stroke-dasharray="${seg} ${C-seg}" stroke-dashoffset="${-i*(seg+g)}" transform="rotate(-90 38 38)" stroke-linecap="round"/>`;}return `<svg width="76" height="76">${o}${d20face(left===0?'!':left)}</svg>`;}
function clockDial(v){const R=32,C=2*Math.PI*R,f=C*v/20;return `<svg width="76" height="76"><circle cx="38" cy="38" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/><circle cx="38" cy="38" r="${R}" fill="none" stroke="${v<=5?'#ffd166':'#bb99ff'}" stroke-width="7" stroke-dasharray="${f} ${C}" transform="rotate(-90 38 38)" stroke-linecap="round"/>${d20face(v)}</svg>`;}
const people=[{id:'a',n:'Aria',c:'#c97b4a',r:17,note:'Holding the torch',own:1},{id:'gm'},{id:'b',n:'Borin',c:'#5a8fd6',r:12,own:1},{id:'c',n:'Cael',c:'#6bbf73',r:8,dead:1,own:1}];
const mons=[{id:'g1',n:'Goblin',c:'#7d8b3a'},{id:'g2',n:'Goblin Boss',c:'#9b4a4a',note:'Leader, WIS +1'}];

const KEY=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5c1.8 1.7 3 3.3 3 5.2a3 3 0 0 1-6 0c0-1.2.6-2 1.3-2.7.3 1 .9 1.5 1.5 1.5C8 6.3 7.8 4.9 8 3.5z"/><path d="M8 12v9M8 16.5h3M8 19h2.5M14 8h7M14 12h7M14 16h5"/></svg>`;
const GEAR=`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path fill-rule="evenodd" d="M20.02 9.52 L22.84 10.14 L22.84 13.86 L20.02 14.48 L19.43 15.92 L20.98 18.35 L18.35 20.98 L15.92 19.43 L14.48 20.02 L13.86 22.84 L10.14 22.84 L9.52 20.02 L8.08 19.43 L5.65 20.98 L3.02 18.35 L4.57 15.92 L3.98 14.48 L1.16 13.86 L1.16 10.14 L3.98 9.52 L4.57 8.08 L3.02 5.65 L5.65 3.02 L8.08 4.57 L9.52 3.98 L10.14 1.16 L13.86 1.16 L14.48 3.98 L15.92 4.57 L18.35 3.02 L20.98 5.65 L19.43 8.08Z M15.6 12a3.6 3.6 0 1 0-7.2 0a3.6 3.6 0 1 0 7.2 0z"/></svg>`;
function rows(s,player){return people.map(p=>{
  const cb=player?'':`<td class="cb"><span class="box BX"></span></td>`;
  if(p.id==='gm'){let h=`<tr class="${s.cur==='gm'?'cur':''}">${cb.replace('BX','')}<td class="av" ${player?'style="padding-left:12px"':''}><i style="background:var(--primary);display:grid;place-items:center;color:#000;font-size:10px;font-weight:800">GM</i></td><td class="nm"><b>GM / Monsters</b>${player?'':'<small class="eq">d20 12 + 2</small>'}</td><td class="in">${player?'':`<span class="d ${s.dex?'open':''}">${d20()}</span>`}14</td></tr>`;
    if(s.dex&&!player)h+=`<tr class="exp"><td colspan="4"><div class="ex">Monsters' DEX <span class="st"><span>−</span><b>+2</b><span>+</span></span><span class="go">Roll d20+2</span></div></td></tr>`;
    const vis=player?mons.slice(0,1):mons;
    {
    h+=`<tr class="mhd"><td colspan="4">${chev(!s.col)} ${s.col?`${vis.length} monsters<span class="stk">${vis.map(m=>`<i style="background:${m.c}"></i>`).join('')}</span>`:'MONSTERS · '+vis.length}</td></tr>`;
    if(!s.col)h+=vis.map(m=>`<tr class="mon ${s.cur===m.id?'cur':''}">${cb.replace('BX','')}<td class="av" ${player?'style="padding-left:12px"':''}><i style="background:${m.c}"></i></td><td class="nm"><b>${m.n}</b>${m.note&&!player?`<small>${m.note}</small>`:''}</td><td class="in"></td></tr>`).join('');}
    return h;}
  const pk=s.pick.includes(p.id);
  return `<tr class="${[s.cur===p.id?'cur':'',pk?'picked':'',p.dead?'dead':''].join(' ')}">${cb.replace('BX',pk?'x':'')}<td class="av" ${player?'style="padding-left:12px"':''}><i style="background:${p.dead?'#3a3f55':p.c};${p.dead?'display:grid;place-items:center;font-size:13px':''}">${p.dead?'💀':(player?'':'<span class="dot"></span>')}</i></td><td class="nm"><b>${p.n}</b>${p.note?`<small>${p.note}</small>`:''}</td><td class="in">${p.r}</td></tr>`;}).join('');}
function hero(s){
  if(s.combat)return `<div class="cbt"><b>Combat</b> · encounter checks paused</div>`;
  const dial=s.clock?clockDial(s.clockV):segDial(s.left,s.of,s.dark);
  const center=s.clock?'clock':(s.left===0?'check now':(s.left+' round'+(s.left>1?'s':'')+' left'));
  const meta=s.clock?`Crawling Clock · d${s.dark?8:6}${s.clockV<=5?' · <span class="omen">omen: roll it now?</span>':''}`:`Check ${s.dark?'every round':'every 3 rounds'}`;
  const face=s.clock?`<span class="num">${s.res}</span><span class="tag">d${s.dark?8:6}</span>`:pips(s.res);
  return `<div class="hero ${s.due?'due':''}"><div class="dcol"><div class="dial">${dial}</div><small>${center}</small></div>
  <div><span class="dd">Unsafe ${chev(1)}</span><div class="meta">${meta}</div><span class="torch ${s.dark?'out':''}">${torch(!s.dark)} ${s.dark?'Torches out':'Torchlit'}</span></div>
  <div class="rollb"><div class="dbx"><div class="die6 ${s.enc?'enc':''} ${s.due?'due':''}">${face}</div></div><small class="${s.enc?'enc':''}">${s.enc?'ENCOUNTER!':s.clock?'−'+s.res+' from clock':'No encounter'}</small><u>Undo</u></div></div>`;}
const pill=s=>`<span class="rp ${s.combat?'cbt2':''}"><i></i>${s.combat?'Combat':'Crawl'} · Round <span class="n">${s.round}</span></span>`;
const chrome=(head,body,foot='v0.1.1')=>`<div class="pop2"><div class="top">${head}</div><div class="body">${body}</div><div class="foot2"><span>${foot}</span></div></div>`;
function gm(s){return chrome(`${KEY}<b>Crawl Keeper</b>${pill(s)}<span class="gear">${GEAR}</span>`,
 `${hero(s)}<div class="tb"><span class="seg"><span class="${s.combat?'':'a'}">Crawl</span><span class="${s.combat?'a red':''}">Combat</span></span><span class="sort">Sort</span><span class="nv"><span>◀</span><span class="a">▶</span></span></div>
 <table><tr><th></th><th></th><th>NAME</th><th style="text-align:right;padding-right:12px">INIT</th></tr>${rows(s,false)}</table>
 <div class="ft"><span>Reset rounds · Remove monsters</span><span>N next · B back · R roll</span></div>`);}
function player(s){return chrome(`${KEY}<b>Crawl Keeper</b>${pill(s)}`,
 `<div class="ph"><div class="dial" style="width:52px;height:52px"><svg width="52" height="52" viewBox="0 0 76 76">${clockDial(s.clockV).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg></div><div class="tx"><b>Crawling</b> · Unsafe<br>The clock is at ${s.clockV}</div></div>
 ${s.cur==='b'?`<div class="yt">${torch(true)} <span><b>Your turn</b>, Borin</span></div>`:''}
 <div style="height:8px"></div>
 <table><tr><th style="padding-left:12px"></th><th>NAME</th><th style="text-align:right;padding-right:12px">INIT</th></tr>${rows(s,true)}</table>`);}
function settings(){const T=(l,h,on)=>`<div class="it"><div class="l"><b>${l}</b><small>${h}</small></div><span class="sw ${on?'on':''}"></span></div>`;
 return chrome(`<span class="back"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span><b>Settings</b>`,
 `<div class="sg"><div class="card"><div class="howto"><span class="ic">?</span><div class="l" style="flex:1"><b style="font-weight:500">How to use Crawl Keeper</b><small style="display:block;color:var(--text2);font-size:11.5px">Setup, turns, hotkeys, crawling and combat</small></div><span style="color:var(--text2)">↗</span></div></div>
 <h3>Encounters</h3><div class="card"><div class="it" style="display:block"><div class="seg2"><span>Standard checks</span><span class="a">Crawling Clock</span></div><div class="dt">▸ Crawling Clock rules</div></div>
 ${T('Roll automatically on the GM turn','When ▶ reaches GM / Monsters in a crawl round and a roll is due, Crawl Keeper rolls it for you. Undo still works.',false)}</div>
 <h3>What players see</h3><div class="card">${T('Hide rounds from players','Players see Crawl or Combat but not the round number.',false)}${T('Hide the clock from players',"Players don't see the Crawling Clock, so they can't play around it.",false)}${T('Show the danger level to players','Players see Unsafe, Risky or Deadly while crawling. The book leaves it to the GM.',true)}</div>
 <h3>Turns and combat</h3><div class="card">${T('Clear initiative rolls on combat','Switching to Combat empties every roll so everyone rolls fresh (core p. 88).',true)}${T('Show the turn marker on the map',"A gold ring around whoever's turn it is. Per token from the row menu.",true)}${T('Select the current token','Each turn, Owlbear selects that token on your screen. Players’ screens don’t change.',true)}</div>
 <h3>About</h3><div class="card"><div class="it" style="display:block"><b style="font-weight:500">Saved data</b><small style="display:block;color:var(--text2);font-size:11.5px;margin-top:2px">This map: 1.2 kB tracker, 3.4 kB all extensions. Room: 0.6 kB of 16 kB.</small></div>
 <div class="it" style="display:block"><b style="font-weight:500">Install link</b><div class="inst"><code>https://crawl-keeper.editbag.workers.dev/manifest.json</code><span>Copy</span></div></div></div></div>`);}
const views=[
 ['<b>GM, crawling.</b> Round pill says the phase. Crawl panel, table, links; the version sits in the footer.',gm({round:5,left:1,of:3,res:5,cur:'b',pick:['a'],col:false})],
 ['<b>GM, combat.</b> Pill and Combat button turn red; the crawl panel folds to one line; monsters take turns.',gm({round:11,combat:true,cur:'g2',pick:[],col:false})],
 ['<b>Player (Borin), Crawling Clock.</b> Small dial (if the GM allows), danger shown (setting on), a “Your turn” strip on their turn. No checkboxes, GM equation or monster notes; only the monsters visible on the map (the Goblin Boss is hidden).',player({round:9,clockV:12,cur:'b',pick:[],col:false})],
 ['<b>Settings (GM).</b> Today’s settings, same groups and wording, restyled to match: cards with hairlines, switches, the mode as a segmented control.',settings()],
];
document.getElementById('out').innerHTML=views.map(([c,v])=>`<div><div class="cap">${c}</div>${v}</div>`).join('');
</script>
</body></html>

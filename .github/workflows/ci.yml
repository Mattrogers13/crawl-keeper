name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tests and builds only: the token can read the repo, nothing more.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build
